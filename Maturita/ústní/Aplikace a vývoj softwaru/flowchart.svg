<svg width="800" height="780" viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#111827">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ═══ START ═══ -->
  <rect x="320" y="20" width="160" height="40" rx="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-weight="700" font-size="15">START</text>

  <line x1="400" y1="60" x2="400" y2="98" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ KROK ═══ -->
  <rect x="320" y="100" width="160" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="400" y="125" text-anchor="middle" fill="#1e40af" font-weight="600">KROK</text>

  <line x1="400" y1="140" x2="400" y2="178" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ Podmínka — 4 větve ═══ -->
  <polygon points="400,178 510,214 400,250 290,214" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="219" text-anchor="middle" fill="#92400e" font-weight="600">Podmínka</text>

  <!-- Svislice na junction bar -->
  <line x1="400" y1="250" x2="400" y2="294" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Popisky větví — nad junction barem -->
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#6b7280">= 1</text>
  <text x="307" y="285" text-anchor="middle" font-size="11" fill="#6b7280">= 2</text>
  <text x="493" y="285" text-anchor="middle" font-size="11" fill="#6b7280">= 3</text>
  <text x="680" y="285" text-anchor="middle" font-size="11" fill="#6b7280">= 4</text>

  <!-- Junction bar -->
  <line x1="120" y1="294" x2="680" y2="294" stroke="#374151" stroke-width="2"/>

  <!-- 4 výstupy dolů -->
  <line x1="120" y1="294" x2="120" y2="334" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="307" y1="294" x2="307" y2="334" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="493" y1="294" x2="493" y2="334" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="294" x2="680" y2="334" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4 boxy -->
  <rect x="60"  y="336" width="120" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="120" y="361" text-anchor="middle" fill="#1e40af" font-weight="600">KROK 1</text>

  <rect x="247" y="336" width="120" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="307" y="361" text-anchor="middle" fill="#1e40af" font-weight="600">KROK 2</text>

  <rect x="433" y="336" width="120" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="493" y="361" text-anchor="middle" fill="#1e40af" font-weight="600">KROK 3</text>

  <rect x="620" y="336" width="120" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="680" y="361" text-anchor="middle" fill="#1e40af" font-weight="600">KROK 4</text>

  <!-- Merge: svislice + vodorovná čára + šipka dolů -->
  <line x1="120" y1="376" x2="120" y2="432" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="307" y1="376" x2="307" y2="432" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="493" y1="376" x2="493" y2="432" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="680" y1="376" x2="680" y2="432" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="120" y1="432" x2="680" y2="432" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="400" y1="432" x2="400" y2="470" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ FOR cyklus ═══ -->

  <!-- Začátek — horní závorka -->
  <polygon points="320,514 320,486 336,470 464,470 480,486 480,514"
           fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="496" text-anchor="middle" fill="#9a3412" font-weight="600" font-size="12">i := 1 to n</text>

  <line x1="400" y1="514" x2="400" y2="552" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tělo cyklu -->
  <rect x="320" y="554" width="160" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <text x="400" y="579" text-anchor="middle" fill="#1e40af" font-weight="600">tělo cyklu</text>

  <line x1="400" y1="594" x2="400" y2="632" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Konec — dolní závorka -->
  <polygon points="320,634 480,634 480,662 464,678 336,678 320,662"
           fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="660" text-anchor="middle" fill="#9a3412" font-weight="600" font-size="12">i</text>

  <line x1="400" y1="678" x2="400" y2="716" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ KONEC ═══ -->
  <rect x="320" y="718" width="160" height="40" rx="20" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="744" text-anchor="middle" font-weight="700" font-size="15">KONEC</text>

</svg>
