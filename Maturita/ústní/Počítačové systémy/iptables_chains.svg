<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 455" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Entry arrow -->
  <line x1="170" y1="5" x2="170" y2="31" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PREROUTING -->
  <rect x="90" y="32" width="160" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="61" text-anchor="middle" font-weight="bold">PREROUTING</text>

  <!-- PREROUTING → Diamond -->
  <line x1="170" y1="78" x2="170" y2="129" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Diamond -->
  <polygon points="170,130 255,170 170,210 85,170" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="175" text-anchor="middle" font-size="12">Routovat?</text>

  <!-- Diamond → FORWARD (Ano) -->
  <line x1="255" y1="170" x2="334" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="293" y="162" text-anchor="middle" font-size="11" fill="#555">Ano</text>

  <!-- Diamond → INPUT (Ne) -->
  <line x1="170" y1="210" x2="170" y2="281" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="248" text-anchor="middle" font-size="11" fill="#555">Ne</text>

  <!-- FORWARD -->
  <rect x="335" y="147" width="155" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="412" y="176" text-anchor="middle" font-weight="bold">FORWARD</text>

  <!-- INPUT -->
  <rect x="90" y="282" width="160" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="311" text-anchor="middle" font-weight="bold">INPUT</text>

  <!-- ZPRACOVÁNÍ -->
  <rect x="190" y="392" width="175" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="277" y="421" text-anchor="middle" font-weight="bold">ZPRACOVÁNÍ</text>

  <!-- OUTPUT -->
  <rect x="335" y="282" width="155" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="412" y="311" text-anchor="middle" font-weight="bold">OUTPUT</text>

  <!-- POSTROUTING (dashed) -->
  <rect x="330" y="32" width="165" height="46" rx="4" fill="white" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="412" y="61" text-anchor="middle" font-weight="bold">POSTROUTING</text>

  <!-- Right bus: FORWARD right stub -->
  <line x1="490" y1="170" x2="515" y2="170" stroke="#333" stroke-width="1.5"/>
  <!-- OUTPUT right stub -->
  <line x1="490" y1="305" x2="515" y2="305" stroke="#333" stroke-width="1.5"/>
  <!-- Vertical bus line -->
  <line x1="515" y1="305" x2="515" y2="55" stroke="#333" stroke-width="1.5"/>
  <!-- Bus → POSTROUTING right -->
  <line x1="515" y1="55" x2="496" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Junction dots -->
  <circle cx="515" cy="170" r="4" fill="#333"/>
  <circle cx="515" cy="305" r="4" fill="#333"/>

  <!-- INPUT → ZPRACOVÁNÍ -->
  <polyline points="170,328 170,415 190,415" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ZPRACOVÁNÍ → OUTPUT bottom -->
  <polyline points="365,415 412,415 412,328" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Exit arrow from POSTROUTING top -->
  <line x1="412" y1="32" x2="412" y2="5" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
