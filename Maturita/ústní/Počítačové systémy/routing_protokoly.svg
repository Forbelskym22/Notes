<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif">

  <!-- Root -->
  <rect x="290" y="20" width="200" height="40" rx="6" fill="#4A90D9"/>
  <text x="390" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Dynamické protokoly</text>

  <!-- IGP -->
  <rect x="100" y="110" width="160" height="40" rx="6" fill="#357ABD"/>
  <text x="180" y="135" text-anchor="middle" fill="white" font-size="13">IGP</text>

  <!-- EGP -->
  <rect x="520" y="110" width="160" height="40" rx="6" fill="#357ABD"/>
  <text x="600" y="135" text-anchor="middle" fill="white" font-size="13">EGP</text>

  <!-- Distance Vector -->
  <rect x="20" y="210" width="160" height="40" rx="6" fill="#2E6DA4"/>
  <text x="100" y="235" text-anchor="middle" fill="white" font-size="12">Distance Vector</text>

  <!-- Link State -->
  <rect x="210" y="210" width="160" height="40" rx="6" fill="#2E6DA4"/>
  <text x="290" y="235" text-anchor="middle" fill="white" font-size="12">Link State</text>

  <!-- Path Vector -->
  <rect x="520" y="210" width="160" height="40" rx="6" fill="#2E6DA4"/>
  <text x="600" y="235" text-anchor="middle" fill="white" font-size="12">Path Vector</text>

  <!-- RIP -->
  <rect x="20" y="310" width="70" height="40" rx="6" fill="#1A4A7A"/>
  <text x="55" y="330" text-anchor="middle" fill="white" font-size="12">RIP</text>
  <text x="55" y="345" text-anchor="middle" fill="#aad4f5" font-size="10">hopy, max 15</text>

  <!-- EIGRP -->
  <rect x="110" y="310" width="70" height="40" rx="6" fill="#1A4A7A"/>
  <text x="145" y="330" text-anchor="middle" fill="white" font-size="12">EIGRP</text>
  <text x="145" y="345" text-anchor="middle" fill="#aad4f5" font-size="10">Cisco, hybridní</text>

  <!-- OSPF -->
  <rect x="210" y="310" width="160" height="40" rx="6" fill="#1A4A7A"/>
  <text x="290" y="330" text-anchor="middle" fill="white" font-size="12">OSPF</text>
  <text x="290" y="345" text-anchor="middle" fill="#aad4f5" font-size="10">cost, Dijkstra, otevřený</text>

  <!-- BGP -->
  <rect x="520" y="310" width="160" height="40" rx="6" fill="#1A4A7A"/>
  <text x="600" y="330" text-anchor="middle" fill="white" font-size="12">BGP</text>
  <text x="600" y="345" text-anchor="middle" fill="#aad4f5" font-size="10">páteř internetu, AS-path</text>

  <!-- Lines: root → IGP/EGP -->
  <line x1="390" y1="60" x2="180" y2="110" stroke="#888" stroke-width="1.5"/>
  <line x1="390" y1="60" x2="600" y2="110" stroke="#888" stroke-width="1.5"/>

  <!-- Lines: IGP → DV / LS -->
  <line x1="180" y1="150" x2="100" y2="210" stroke="#888" stroke-width="1.5"/>
  <line x1="180" y1="150" x2="290" y2="210" stroke="#888" stroke-width="1.5"/>

  <!-- Lines: EGP → PV -->
  <line x1="600" y1="150" x2="600" y2="210" stroke="#888" stroke-width="1.5"/>

  <!-- Lines: DV → RIP / EIGRP -->
  <line x1="100" y1="250" x2="55" y2="310" stroke="#888" stroke-width="1.5"/>
  <line x1="100" y1="250" x2="145" y2="310" stroke="#888" stroke-width="1.5"/>

  <!-- Lines: LS → OSPF -->
  <line x1="290" y1="250" x2="290" y2="310" stroke="#888" stroke-width="1.5"/>

  <!-- Lines: PV → BGP -->
  <line x1="600" y1="250" x2="600" y2="310" stroke="#888" stroke-width="1.5"/>

</svg>
