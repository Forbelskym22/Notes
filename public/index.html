<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maturitní zápisky</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notes.css">
</head>
<body class="bg-white text-gray-900 h-dvh flex overflow-hidden">

  <div id="overlay" class="fixed inset-0 bg-black/30 z-20 hidden lg:hidden"></div>

  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-64 shrink-0 bg-amber-50 border-r border-amber-100 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="px-4 py-4 border-b border-amber-100 flex items-center justify-between">
      <h1 class="font-semibold text-gray-900 text-sm">Maturitní zápisky</h1>
      <button id="btn-close-sidebar" class="lg:hidden p-1 text-gray-400 hover:text-gray-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <nav id="nav" class="overflow-y-auto flex-1"></nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div class="lg:hidden flex items-center gap-3 px-4 py-3 border-b border-gray-200">
      <button id="btn-open-sidebar" class="p-1 shrink-0 text-gray-500 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="mobile-title" class="text-sm font-medium text-gray-700 truncate flex-1">Vyber zápisek</span>
      <button id="btn-pdf-mobile" class="hidden shrink-0 text-xs px-2.5 py-1 rounded-md bg-amber-400 text-gray-900 font-medium">PDF</button>
    </div>

    <main class="flex-1 overflow-y-auto">
      <div id="welcome" class="flex items-center justify-center h-full text-gray-400 text-sm">
        Vyber zápisek ze seznamu.
      </div>
      <div id="note-view" class="hidden">
        <div id="note-toolbar" class="hidden lg:flex items-center sticky top-0 bg-white border-b border-gray-200 px-6 py-4 z-10 relative min-h-[4rem]">
          <h1 id="note-title" class="absolute left-1/2 -translate-x-1/2 text-2xl font-bold text-gray-900 text-center leading-tight max-w-[50%] truncate pointer-events-none"></h1>
          <div class="ml-auto shrink-0 flex items-center gap-1.5">
            <button id="btn-flashcards" class="text-sm px-3 py-1.5 rounded-md bg-amber-100 text-amber-900 hover:bg-amber-200 transition-colors font-medium">Kartičky</button>
            <button id="btn-download" class="text-sm px-3 py-1.5 rounded-md bg-amber-400 text-gray-900 hover:bg-amber-500 transition-colors font-medium">.md</button>
            <button id="btn-pdf" class="text-sm px-3 py-1.5 rounded-md bg-amber-400 text-gray-900 hover:bg-amber-500 transition-colors font-medium">PDF</button>
          </div>
        </div>
        <article id="note-content" class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10 w-full"></article>
      </div>

      <div id="flashcard-view" class="hidden h-full flex flex-col">
        <div class="hidden lg:flex items-center sticky top-0 bg-white border-b border-gray-200 px-4 py-3 z-10 relative min-h-[3.25rem]">
          <button id="btn-back-to-note" class="shrink-0 text-sm px-3 py-1.5 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">← zápisek</button>
          <span id="card-counter" class="absolute left-1/2 -translate-x-1/2 text-sm text-gray-400 pointer-events-none"></span>
          <button id="btn-reverse-cards" class="ml-auto shrink-0 text-sm px-3 py-1.5 rounded-md border border-gray-300 text-gray-600 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-900 transition-colors">⇄ Obrácené</button>
        </div>
        <div id="flashcard-loading" class="flex-1 flex flex-col items-center justify-center gap-3 text-gray-400">
          <svg class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
          <span class="text-sm">Načítám kartičky…</span>
        </div>
        <div id="flashcard-content" class="hidden flex-1 flex flex-col items-center justify-center gap-4 p-6">
          <div id="card-mode-badge" class="hidden text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">Obrácený mód</div>
          <div id="card-wrap" class="cursor-pointer select-none w-full" style="max-width:520px;perspective:1200px" onclick="flipCard()">
            <div id="card-inner" class="relative w-full transition-transform duration-500" style="height:200px;transform-style:preserve-3d">
              <div class="card-face absolute inset-0 bg-white border-2 border-amber-200 rounded-2xl p-6 flex items-center justify-center shadow-sm">
                <p id="card-q" class="text-center text-base font-medium text-gray-800 leading-relaxed"></p>
              </div>
              <div class="card-face absolute inset-0 bg-amber-50 border-2 border-amber-300 rounded-2xl p-6 flex items-center justify-center shadow-sm" style="transform:rotateY(180deg)">
                <p id="card-a" class="text-center text-sm text-gray-700 leading-relaxed"></p>
              </div>
            </div>
          </div>
          <p class="text-xs text-gray-400">klikni nebo mezerník pro otočení</p>
          <div class="flex items-center gap-3">
            <button id="card-prev" class="px-4 py-1.5 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors text-sm disabled:opacity-30">←</button>
            <button id="card-next" class="px-4 py-1.5 rounded-lg bg-amber-400 text-gray-900 hover:bg-amber-500 transition-colors font-medium text-sm disabled:opacity-30">→</button>
          </div>
          <div class="lg:hidden flex items-center gap-3">
            <button id="btn-reverse-cards-mobile" class="text-sm px-3 py-1.5 rounded-md border border-gray-300 text-gray-600 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-900 transition-colors">⇄ Obrácené</button>
            <button id="btn-back-to-note-mobile" class="text-sm text-gray-400 hover:text-gray-600 underline">← zpět na zápisek</button>
          </div>
        </div>
        <div id="flashcard-error" class="hidden flex-1 flex items-center justify-center text-red-400 text-sm">
          Nepodařilo se vygenerovat kartičky.
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
